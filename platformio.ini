; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Placa: ESP32-WROOM-32 DevKit (30 pinos) + shield de expansao
; LED azul onboard no GPIO2 (marcado "D2")

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Wi-Fi + HTTPS + servidor web nao cabem na particao padrao de 1,25 MB
; min_spiffs: 1,9 MB por app (mantem OTA), 190 kB de SPIFFS
board_build.partitions = min_spiffs.csv

; Monitor serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload
upload_speed = 921600
; upload_port = COM5      ; descomente e ajuste se houver mais de uma porta COM
; monitor_port = COM5

; Sensor de temperatura DS18B20 (1-Wire) no GPIO4 ("D4")
; Sensores de corrente SCT-013-005 em D34, D35 e D32 (ADC1), sem biblioteca externa
; Acelerometro ADXL345 (modulo GY-291, I2C) em D21 (SDA) / D22 (SCL), lido direto pelos registradores
; Wi-Fi configurado pelo portal do WiFiManager (AP "coletor-XXXXXX")
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.1
